name: rebuild-v0.8-from-an-empty-folder
# Fetches the pinned toolchain, stages the v0.8 build tree and builds it on a clean GitHub-hosted
# Apple-silicon runner. The build checks its own pins and ends with PASS v0.8 only if the Wasm digests match.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the pinned toolchain
        run: sh release-tools/fetch-toolchain.sh toolchain
      - name: Stage the build tree
        run: python3 release-tools/build-tree.py v0.8 ../core-build --toolchain toolchain
      - name: Build
        run: |
          set -o pipefail
          sh ../core-build/v0.8/build.sh 2>&1 | tee build.log
          grep -q '^PASS v0.8' build.log
      - name: Show the digests
        run: shasum -a 256 ../core-build/v0.8/*.wasm || true
